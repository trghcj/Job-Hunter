<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#E09F3E">
  <title>{% block title %}JobHunter{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="32" height="32">JobHunter</a>
    {% if user %}
    <nav class="topnav" aria-label="Main">
      <a href="/" {% if page == "jobs" %}aria-current="page"{% endif %}>My jobs</a>
      <a href="/settings" {% if page == "settings" %}aria-current="page"{% endif %}>Settings</a>
      {% if user.is_owner %}<a href="/admin" {% if page == "admin" %}aria-current="page"{% endif %}>Admin</a>{% endif %}
    </nav>
    <div class="usermenu">
      <span class="who">{{ user.name or user.email }}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
