name: Daily job digest

on:
  schedule:
    # GitHub may delay or even drop scheduled runs at busy times, especially at the top
    # of the hour. So: one main time off the hour, plus two backups. Every scheduled run
    # uses --once-per-day, so a backup does nothing if an earlier run already succeeded.
    - cron: "13 2 * * *" # 02:13 UTC = 7:43 AM IST (main)
    - cron: "43 3 * * *" # 03:43 UTC = 9:13 AM IST (backup)
    - cron: "13 6 * * *" # 06:13 UTC = 11:43 AM IST (backup)
  workflow_dispatch: # "Run workflow" button: always runs

permissions:
  contents: read

concurrency:
  group: jobhunter-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Apply database migrations
        run: python -m jobhunter migrate

      - name: Fetch, filter and email the digest
        run: python -m jobhunter run ${{ github.event_name == 'schedule' && '--once-per-day' || '' }}
