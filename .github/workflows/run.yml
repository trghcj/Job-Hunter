name: Daily job digest

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 7:30 AM IST (GitHub may start it a few minutes late)
  workflow_dispatch: # "Run workflow" button for manual runs

permissions:
  contents: read

concurrency:
  group: jobhunter-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Apply database migrations
        run: python -m jobhunter migrate

      - name: Fetch, filter and email the digest
        run: python -m jobhunter run
