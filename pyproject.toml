[project]
name = "jobhunter"
version = "0.1.0"
description = "Daily India job digest: fetch, dedupe, score, email."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6",
    "cryptography>=42", # encrypts the Gmail app password saved on the settings page
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gmail_alerts.py" = ["E501"] # sample emails keep their real long links

[tool.ruff.lint.isort]
# The repo's alembic/ migrations folder would otherwise make ruff treat the package as local.
known-third-party = ["alembic"]
known-first-party = ["jobhunter"]
