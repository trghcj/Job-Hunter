# Render Blueprint: the JobHunter web app (Google sign-in, My jobs, Settings, Admin) on
# Render's free plan. Values marked `sync: false` are typed into the Render dashboard,
# never stored in git.
services:
  - type: web
    name: jobhunter-settings
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Editable install: templates, static files and config.yaml are read from the checkout.
    # Migrations run on every build, so new pages never start against old tables.
    buildCommand: pip install -e ".[web]" && python -m jobhunter migrate
    startCommand: uvicorn jobhunter.web.app:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL # Supabase session pooler string (port 5432)
        sync: false
      - key: SESSION_SECRET # signs the login cookie
        generateValue: true
      - key: SETTINGS_KEY # encrypts Gmail app passwords; same value as .env and GitHub
        sync: false
      - key: OWNER_EMAIL # your Google sign-in email: you become the owner
        sync: false
      - key: ALLOWED_EMAILS # optional, comma-separated: invite-only (owner always allowed)
        sync: false
      - key: ADMIN_EMAILS # optional, comma-separated: these accounts also get Admin
        sync: false
      - key: FIREBASE_API_KEY # the four public values from Firebase > Project settings
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
